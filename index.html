<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipes de Carregamento - Painel Admin</title>
    <style>
        /* TELA DE LOGIN */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0b1a2a;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(255, 255, 255, 0.03) 4px, rgba(255, 255, 255, 0.03) 5px);
            z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white;
            font-family: 'Arial', sans-serif;
        }
        .login-box {
            background-color: #0c1824; padding: 40px; border-radius: 10px;
            border: 2px solid #fca311; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .login-box h2 { margin-top: 0; text-transform: uppercase; letter-spacing: 2px; color: #fca311; }
        .login-box input {
            padding: 12px; width: 80%; margin-bottom: 20px;
            background: #111; color: white; border: 1px solid #555; border-radius: 5px;
            text-align: center; font-size: 18px;
        }
        .login-box button {
            padding: 12px 30px; background-color: #fca311; color: black;
            border: none; border-radius: 5px; font-weight: 900; font-size: 16px;
            cursor: pointer; text-transform: uppercase; width: 88%;
        }
        .login-box button:hover { background-color: #e3910c; }

        /* FUNDO DO APP */
        body {
            font-family: 'Poppins','Montserrat','Segoe UI',Roboto,Arial,sans-serif;
            background-color: #0b0c0e;
            background-image: radial-gradient(ellipse at 50% 0%, #161b24 0%, #0b0c0e 60%);
            background-attachment: fixed;
            color: white; margin: 0; padding: 14px 10px 30px; min-height: 100vh;
        }
        .page { max-width: 1312px; margin: 0 auto; position: relative; }

        /* CABEÇALHO (arte original) */
        .header-container { display: flex; align-items: center; justify-content: space-between; position: relative; margin-bottom: 34px; }
        .header-container img { display: block; height: auto; mix-blend-mode: screen; }
        .header-img { width: 79.5%; }
        .foco-img { width: 15.5%; margin-right: 1%; }
        .btn-sair {
            position: absolute; right: 1.6%; top: calc(100% + 2px); z-index: 5;
            background-color: rgba(255,68,68,.9); color: white; border: none; padding: 4px 9px;
            border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        .btn-sair:hover { background-color: #cc0000; }

        /* GRADE */
        .container {
            display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px 15px; margin: 0 1.6% 22px;
        }
        @media (max-width: 950px) { .container { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 620px) { .container { grid-template-columns: 1fr; margin: 0 0 20px; } }

        /* CARTÃO — tudo medido em "u" = 1/411 da largura do cartão, igual à imagem */
        .equipe-card { container-type: inline-size; display: flex; min-width: 0; }
        .card-in {
            --u: calc(100cqw / 411);
            position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column;
            padding-top: calc(var(--cut) * var(--u)); padding-bottom: calc(13 * var(--u));
            background: #050b11; border-radius: calc(14 * var(--u));
            box-shadow: 0 0 calc(22 * var(--u)) color-mix(in srgb, var(--c) 30%, transparent), 0 6px 16px rgba(0,0,0,.6);
        }
        .card-in::after {
            content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 6;
            border: calc(2 * var(--u)) solid var(--c);
        }
        .art {
            position: absolute; left: calc(3 * var(--u)); top: calc(3 * var(--u));
            width: calc(var(--aw) * var(--u)); height: calc(var(--ah) * var(--u));
            background-size: 100% 100%; background-repeat: no-repeat;
            mix-blend-mode: lighten; pointer-events: none; z-index: 2;
        }

        .equipe-reserva { --c:#8a8f98; --bl:18; --tc:205; --ts:40; --cut:80; }
                .equipe-reserva .card-in::after { border-style: dashed; }
        .equipe-reserva .card-body { border-top: calc(2 * var(--u)) solid var(--c); border-radius: calc(16 * var(--u)); }
        .equipe-reserva .integrantes-titulo { display: none; }
        .equipe-reserva .card-in { padding-top: calc(80 * var(--u)); }
        .equipe-reserva .titulo-wrap { top: calc(12 * var(--u)); }

        /* TÍTULO */
        .titulo-wrap {
            position: absolute; top: calc(26 * var(--u)); left: calc(var(--tc) * var(--u));
            transform: translateX(-50%); text-align: center; white-space: nowrap; z-index: 3;
            display: flex; flex-direction: column; align-items: center;
        }
        .equipe-nome-grande {
            margin: 0; height: calc(80 * var(--u)); display: flex; align-items: center;
            font-family: Impact, 'Anton', 'Arial Narrow', 'Arial Black', sans-serif; font-weight: 400;
            font-style: italic; text-transform: uppercase; letter-spacing: calc(1 * var(--u));
            font-size: calc(var(--ts) * var(--u)); line-height: 1; color: var(--c);
            text-shadow: 0 calc(2*var(--u)) calc(3*var(--u)) rgba(0,0,0,.7), 0 0 calc(12*var(--u)) color-mix(in srgb, var(--c) 45%, transparent);
        }
        .equipe-slogan {
            margin-top: calc(2 * var(--u)); color: #e6e6e6; text-transform: uppercase;
            font-family: 'Arial Narrow','Roboto Condensed',Impact,sans-serif; font-weight: 600;
            font-size: calc(16 * var(--u)); letter-spacing: calc(.8 * var(--u));
        }

        /* CAIXA DE INTEGRANTES */
        .card-body {
            position: relative; z-index: 1;
            margin: 0 calc(18 * var(--u)) 0 calc(var(--bl) * var(--u));
            min-height: calc((357 - var(--cut)) * var(--u)); box-sizing: border-box;
            border: calc(2 * var(--u)) solid var(--c); border-top: none; border-radius: 0 0 calc(16 * var(--u)) calc(16 * var(--u));
            padding: 0 calc(14 * var(--u)) calc(6 * var(--u)) calc(14 * var(--u));
            background: #04090e; display: flex; flex-direction: column;
        }
        .integrantes-titulo {
            display: flex; align-items: center; gap: calc(9 * var(--u)); height: calc(26 * var(--u)); margin-bottom: calc(8 * var(--u));
            font-weight: 700; font-size: calc(17 * var(--u)); color: var(--c); text-transform: uppercase;
            font-family: 'Arial Narrow','Roboto Condensed',Impact,sans-serif; letter-spacing: calc(.5 * var(--u));
        }
        .ico-grupo { width: calc(30 * var(--u)); height: calc(22 * var(--u)); fill: var(--c); }
        .lista-integrantes { flex-grow: 1; min-height: calc(120 * var(--u)); }
        .integrante {
            height: calc(25 * var(--u)); font-size: calc(20 * var(--u)); font-weight: 500; color: #fff;
            cursor: grab; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 3;
        }
        .integrante:active { cursor: grabbing; }
        .nome-container { display: flex; align-items: center; gap: calc(14 * var(--u)); }
        .seta {
            display: inline-block; width: calc(9 * var(--u)); height: calc(9 * var(--u));
            border-top: calc(3.5 * var(--u)) solid var(--c); border-right: calc(3.5 * var(--u)) solid var(--c);
            transform: rotate(45deg); margin: 0 calc(5 * var(--u)) 0 calc(2 * var(--u));
        }

        /* Botões lápis e X (aparecem ao passar o mouse) */
        .acoes-container { display: flex; gap: 8px; align-items: center; opacity: .55; transition: .2s; }
        @media (hover: hover) { .acoes-container { opacity: 0; } .integrante:hover .acoes-container { opacity: 1; } }
        .btn-acao { background: none; border: none; cursor: pointer; font-size: 14px; padding: 0; color: #fff; }
        .btn-lapis:hover { transform: scale(1.2); }
        .btn-remover { color: #ff4444; font-weight: bold; font-size: 16px; }
        .btn-remover:hover { color: red; transform: scale(1.2); }

        /* Adicionar nome (discreto) */
        .add-container { display: flex; margin-top: calc(6 * var(--u)); gap: 5px; opacity: .45; transition: .2s; }
        .add-container:hover, .add-container:focus-within { opacity: 1; }
        .add-container input {
            flex-grow: 1; min-width: 0; background: rgba(255,255,255,.06); border: 1px solid #333;
            color: white; padding: 5px 8px; font-size: 12px; border-radius: 6px;
        }
        .add-container button { background-color: #2b2f36; color: white; border: none; cursor: pointer; padding: 5px 12px; border-radius: 6px; font-weight: bold; font-size: 12px; }
        .add-container button:hover { background-color: #555; }

        /* LÍDER DA SEMANA */
        .lider-container {
            margin: calc(7 * var(--u)) calc(20 * var(--u)) 0 calc(14 * var(--u)); height: calc(39 * var(--u));
            border-radius: calc(11 * var(--u)); background: var(--c); color: #0b0f14;
            display: flex; align-items: center; gap: calc(10 * var(--u)); padding: 0 calc(14 * var(--u)); box-sizing: border-box;
            margin-top: auto; position: relative; z-index: 3;
        }
        .card-body + .lider-container { margin-top: calc(7 * var(--u)); }
        .lider-icon svg { width: calc(22 * var(--u)); height: calc(22 * var(--u)); fill: #0b0f14; display: block; }
        .lider-label {
            font-family: 'Arial Narrow','Roboto Condensed',Impact,sans-serif; font-size: calc(15 * var(--u));
            font-weight: 800; text-transform: uppercase; white-space: nowrap; letter-spacing: calc(.4 * var(--u));
        }
        .lider-container input {
            flex: 1; min-width: 0; background: transparent; border: none; border-bottom: calc(2 * var(--u)) solid rgba(11,15,20,.8);
            font-weight: 700; font-size: calc(15 * var(--u)); color: inherit; padding: 0 2px; margin-top: calc(10 * var(--u));
        }
        .lider-container input:focus { outline: none; border-bottom-color: #000; }

        /* RODAPÉ (arte original) */
        .footer-img { display: block; width: 98%; height: auto; margin: 0 auto; mix-blend-mode: screen; }
        .slogan-img { display: block; width: 45.3%; height: auto; margin: -2px auto 0; mix-blend-mode: screen; }

        /* ===== NOVO: barra superior, caminhões, modais ===== */
        .header-container { margin-bottom: 12px; }
        .topbar {
            display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
            margin: 0 1.6% 16px; padding: 10px 14px; background: #0a1118; border: 1px solid #1f2a36; border-radius: 12px;
        }
        .tb-hoje { display: flex; flex-direction: column; gap: 2px; }
        .tb-dia { font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .3px; }
        .tb-sub { font-size: 12px; color: #9aa7b4; }
        .tb-trucks { display: flex; gap: 8px; flex-wrap: wrap; }
        .chip { padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; text-transform: uppercase; }
        .chip b { margin-right: 6px; }
        .chip-fg { background: #fff; color: #111; }
        .chip-hjt { background: #111; color: #fff; border: 2px solid #fff; padding: 3px 10px; }
        .tb-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn { background: #1b2430; color: #fff; border: 1px solid #2c3948; border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .btn:hover { background: #26323f; }
        .btn-ok { background: #fca311; color: #000; border-color: #fca311; }
        .btn-ok:hover { background: #e3910c; }
        .btn-aviso { background: #3a1c1c; border-color: #6b2b2b; }
        .btn-sair2 { background: rgba(255,68,68,.9); border-color: transparent; }
        .status { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: #111a23; }
        .st-ok { color: #6fe38a; } .st-erro { color: #ff7a7a; } .st-local { color: #ffd37a; }

        /* selo do caminhão no cartão */
        .truck-badge {
            position: absolute; top: calc(7 * var(--u)); right: calc(12 * var(--u)); z-index: 7;
            display: inline-flex; align-items: center; gap: calc(6 * var(--u)); cursor: pointer; font-family: inherit;
            padding: calc(3 * var(--u)) calc(11 * var(--u)); border-radius: 999px; border: 2px solid #fff;
            font-size: max(11px, calc(15 * var(--u))); font-weight: 800; letter-spacing: .5px;
        }
        .truck-badge b { font-weight: 800; }
        .truck-badge .ico-truck { width: max(14px, calc(22 * var(--u))); height: auto; fill: currentColor; }
        .truck-badge.fg { background: #fff; color: #111; }
        .truck-badge.hjt { background: #111; color: #fff; }
        .truck-badge.vazio { background: rgba(0,0,0,.55); color: #aaa; border-style: dashed; border-color: #666; }
        .truck-badge.manual { box-shadow: 0 0 0 2px #fca311; }
        .truck-badge:disabled { cursor: default; }
        #menuCam { position: fixed; display: none; z-index: 10000; background: #0c1824; border: 1px solid #fca311; border-radius: 10px; padding: 6px; min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,.7); }
        #menuCam .mc-titulo { font-size: 11px; color: #9aa7b4; padding: 4px 8px 6px; text-transform: uppercase; }
        #menuCam button { display: block; width: 100%; text-align: left; background: none; border: none; color: #fff; padding: 9px 10px; font-size: 14px; border-radius: 6px; cursor: pointer; font-family: inherit; }
        #menuCam button:hover { background: #1b2a3a; }
        #menuCam button.sel { background: #fca311; color: #000; font-weight: 700; }

        /* modo só-visualizar */
        body.ro .acoes-container, body.ro .add-container { display: none; }
        body.ro .integrante { cursor: default; }

        /* modal */
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 9998; display: none; align-items: center; justify-content: center; padding: 14px; }
        #modal.aberto { display: flex; }
        .modal-box { background: #0c1824; border: 2px solid #fca311; border-radius: 12px; width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; padding: 18px 20px; }
        .modal-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .modal-topo h3 { margin: 0; color: #fca311; text-transform: uppercase; font-size: 16px; letter-spacing: 1px; }
        .modal-x { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
        .m-info { font-size: 13px; color: #aab6c2; line-height: 1.45; }
        .m-label { display: block; font-size: 12px; text-transform: uppercase; color: #fca311; margin: 14px 0 6px; font-weight: 700; }
        .m-input { width: 100%; box-sizing: border-box; padding: 9px 10px; background: #111; color: #fff; border: 1px solid #3a4655; border-radius: 6px; font-size: 14px; font-family: inherit; }
        .m-tab { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; }
        .m-tab th, .m-tab td { border: 1px solid #243140; padding: 6px 8px; text-align: left; }
        .m-tab th { color: #9aa7b4; font-weight: 600; }
        .chk-linha { display: flex; gap: 8px; flex-wrap: wrap; }
        .chk { display: flex; align-items: center; gap: 4px; padding: 6px 10px; background: #111a23; border-radius: 6px; font-size: 13px; cursor: pointer; }
        .m-acoes { display: flex; gap: 8px; margin-top: 16px; }
        .u-lista { display: flex; flex-direction: column; gap: 8px; }
        .u-linha { display: grid; grid-template-columns: 1fr 150px auto auto; gap: 6px; align-items: center; }
        .u-nome { font-weight: 700; word-break: break-all; }
        .u-nome i { font-weight: 400; color: #9aa7b4; font-size: 12px; }
        .u-novo { display: grid; gap: 8px; }
        code { background: #111; padding: 1px 5px; border-radius: 4px; color: #ffd37a; }
        @media (max-width: 560px) { .u-linha { grid-template-columns: 1fr 1fr; } .topbar { margin: 0 0 14px; } }
        .equipe-reserva .card-in { padding-top: calc(118 * var(--u)); }
        .equipe-reserva .titulo-wrap { top: calc(6 * var(--u)); }
        .login-box h2 { margin-bottom: 24px; }
        .avaria-btn {
            margin: calc(7 * var(--u)) calc(20 * var(--u)) 0 calc(14 * var(--u)); height: calc(34 * var(--u)); min-height: 26px;
            border-radius: calc(11 * var(--u)); border: calc(2 * var(--u)) solid var(--c); background: transparent; color: var(--c);
            font: 800 max(11px, calc(14 * var(--u))) 'Arial Narrow','Roboto Condensed',Impact,sans-serif; text-transform: uppercase;
            letter-spacing: calc(.4 * var(--u)); cursor: pointer; position: relative; z-index: 3;
        }
        .avaria-btn:hover { background: color-mix(in srgb, var(--c) 18%, transparent); }
        .av-form { display: grid; grid-template-columns: 1fr 90px; gap: 6px; }
        .av-form .full { grid-column: 1 / -1; }
        #printArea { display: none; }
        @page { margin: 12mm; }
        @media print {
            body > *:not(#printArea) { display: none !important; }
            body { background: #fff !important; color: #000; padding: 0; min-height: 0; }
            #printArea { display: block; font-family: Arial, sans-serif; font-size: 12px; color: #000; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #printArea h1 { font-size: 20px; margin: 0 0 2px; }
            #printArea .sub { color: #444; margin: 2px 0 8px; }
            .rp-sec { break-inside: avoid; margin-bottom: 22px; }
            .rp-sec h2 { font-size: 16px; margin: 14px 0 4px; padding-bottom: 3px; border-bottom: 4px solid var(--c); }
            #printArea table { width: 100%; border-collapse: collapse; margin-top: 6px; }
            #printArea th, #printArea td { border: 1px solid #666; padding: 5px 7px; text-align: left; }
            #printArea th { background: #eee; }
            #printArea tr { break-inside: avoid; }
            .ass { display: flex; gap: 40px; margin-top: 50px; }
            .ass div { flex: 1; border-top: 1px solid #000; text-align: center; padding-top: 4px; }
        }
    </style>
</head>

const SHA_K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256(str) {

}

/* ---------- DATAS ---------- */
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

}

let S = null;

function contaUteis(dias, a, b) { // dias de carregamento entre a e b usando uma lista de dias qualquer
    if (ymd(a) === ymd(b)) return 0;
    let n = 0;
    if (b > a) { for (let x = addDias(a, 1); x <= b; x = addDias(x, 1)) if (dias.includes(x.getDay())) n++; return n; }
    for (let x = a; x > b; x = addDias(x, -1)) if (dias.includes(x.getDay())) n--;
    return n;
}
function padrao() {
    const times = {};
    IDS.forEach(id => times[id] = { integrantes: (INTEGRANTES_INICIAIS[id] || []).slice(), lider: '', avarias: [] });
    return {
        v: 11, times,
        config: { base: { data: ymd(segundaRecente()), passo: 1 }, dias: [1, 2, 3, 4, 5], feriados: {}, feriadosOff: [] }, // só seg–sex; feriados: extras {data:nome}; feriadosOff: feriados automáticos em que TRABALHA
        manual: { data: '', t: {} },

}
const toArr = v => Array.isArray(v) ? v.filter(x => x != null) : (v && typeof v === 'object' ? Object.values(v) : []);
function norm(r) {

    IDS.forEach(id => {
        const t = r.times && r.times[id];
        out.times[id].integrantes = t ? toArr(t.integrantes).map(String) : [];
        out.times[id].lider = (t && t.lider) || '';
        out.times[id].avarias = t ? toArr(t.avarias).filter(a => a && typeof a === 'object').map(a => ({ id: String(a.id || ''), data: String(a.data || ''), produto: String(a.produto || ''), qtd: +a.qtd || 0, obs: String(a.obs || '') })) : [];
    });
    if (!r.times) IDS.forEach(id => out.times[id].integrantes = (INTEGRANTES_INICIAIS[id] || []).slice());
    if (r.config) {
        if (r.config.base && r.config.base.data) out.config.base = { data: r.config.base.data, passo: Math.min(6, Math.max(1, +r.config.base.passo || 1)) };
        const dias = toArr(r.config.dias).map(Number).filter(n => n >= 0 && n <= 6);
        if (dias.length) out.config.dias = dias;
        if (r.config.feriados && typeof r.config.feriados === 'object' && !Array.isArray(r.config.feriados)) {
            Object.keys(r.config.feriados).forEach(k => { if (/^\d{4}-\d{2}-\d{2}$/.test(k)) out.config.feriados[k] = String(r.config.feriados[k] || 'Feriado'); });
        }

    // MIGRAÇÃO v11: sábado/domingo e feriados saem do rodízio sem mudar a equipe de hoje

            const n = contaUteis(antigos, parseYmd(base.data), ref);

/* ---------- FERIADOS ---------- */
function pascoa(a) { // algoritmo de Meeus/Jones/Butcher
    const A = a % 19, B = Math.floor(a / 100), C = a % 100, D = Math.floor(B / 4), E = B % 4, F = Math.floor((B + 8) / 25),

        L = (32 + 2 * E + 2 * I - H - K) % 7, M = Math.floor((A + 11 * H + 22 * L) / 451),
        mes = Math.floor((H + L - 7 * M + 114) / 31), dia = ((H + L - 7 * M + 114) % 31) + 1;
    return new Date(a, mes - 1, dia);
}
const _fcache = {};
function feriadosAno(ano) { // feriados nacionais (e Carnaval / Corpus Christi, pontos facultativos)
    if (_fcache[ano]) return _fcache[ano];
    const m = {}, fx = (mm, dd, n) => { m[ano + '-' + String(mm).padStart(2, '0') + '-' + String(dd).padStart(2, '0')] = n; };
    fx(1, 1, 'Confraternização Universal'); fx(4, 21, 'Tiradentes'); fx(5, 1, 'Dia do Trabalho'); fx(9, 7, 'Independência');
    fx(10, 12, 'N. Sra. Aparecida'); fx(11, 2, 'Finados'); fx(11, 15, 'Proclamação da República'); fx(11, 20, 'Consciência Negra'); fx(12, 25, 'Natal');
    const p = pascoa(ano);
    m[ymd(addDias(p, -48))] = 'Carnaval'; m[ymd(addDias(p, -47))] = 'Carnaval';

}
function feriadoDe(d, cfg) { // nome do feriado (ou null se for dia normal / dia em que trabalha)
    const k = ymd(d);
    if (cfg.feriados && cfg.feriados[k]) return cfg.feriados[k];
    if ((cfg.feriadosOff || []).includes(k)) return null;
    return feriadosAno(d.getFullYear())[k] || null;
}

/* ---------- RODÍZIO FG / HJT ---------- */
const ehUtil = d => S.config.dias.includes(d.getDay()) && !feriadoDe(d, S.config);
function efetivo(d) {
    let x = d ? new Date(d.getFullYear(), d.getMonth(), d.getDate()) : (() => { const h = new Date(); return new Date(h.getFullYear(), h.getMonth(), h.getDate()); })();
    for (let i = 0; i < 40 && !ehUtil(x); i++) x = addDias(x, 1);
    return x;
}
function utilEntre(a, b) { // quantos dias de carregamento de a até b (negativo se b < a)
    if (ymd(a) === ymd(b)) return 0;
    let n = 0;
    if (b > a) { for (let x = addDias(a, 1); x <= b; x = addDias(x, 1)) if (ehUtil(x)) n++; return n; }
    for (let x = a; x > b; x = addDias(x, -1)) if (ehUtil(x)) n--;
    return n;
}
function passoDe(d) {

    return ((n % 6) + 6) % 6; // 0..5
}
function rodizio(step) {

}
function caminhaoDe(id) {
    const ef = efetivo(), hoje = ymd(ef);
    if (S.manual.data === hoje && S.manual.t[id] != null) return { v: S.manual.t[id], manual: true };

/* ---------- SINCRONIZAÇÃO (tempo real) ---------- */
const Sync = {
    url: (localStorage.getItem('dbUrl') || DB_URL || '').replace(/\/+$/, ''),
    pend: 0, estado: 'local', es: null, timer: null,
    status(e) { this.estado = e; renderStatus(); },
    async ler() {
        const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
        try {
            const r = await fetch(this.url + '/app.json', { signal: ctl.signal, cache: 'no-store' });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return await r.json();
        } finally { clearTimeout(t); }
    },
    async escrever(path, val) {
        const r = await fetch(this.url + '/app' + (path ? '/' + path : '') + '.json', {
            method: val == null ? 'DELETE' : 'PUT',
            body: val == null ? undefined : JSON.stringify(val)
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
    },
    agendarLeitura() { clearTimeout(this.timer); this.timer = setTimeout(() => this.atualizar(), 150); },
    async atualizar() {
        if (this.pend > 0) return;
        try {
            const raw = await this.ler();
            if (this.pend > 0) return;
            this.status('ok');
            const novo = norm(raw);
            if (JSON.stringify(novo) !== JSON.stringify(S)) {
                S = novo;
                try { localStorage.setItem(CHAVE_LOCAL, JSON.stringify(S)); } catch (e) { }
                gravarMigracao();
                pedirRender();
            }
        } catch (e) { this.status('erro'); }
    },
    ligar() {
        if (!this.url) return;
        try {
            this.es = new EventSource(this.url + '/app.json');
            this.es.addEventListener('put', () => this.agendarLeitura());
            this.es.addEventListener('patch', () => this.agendarLeitura());
            this.es.onerror = () => { this.status('erro'); };
            this.es.onopen = () => { this.status('ok'); };
        } catch (e) { }
        setInterval(() => this.atualizar(), 20000); // garantia extra
    }
};
function gravarMigracao() { if (migrouDias) { migrouDias = false; salvar('config', 'v'); } }
function valorEm(p) { return p.split('/').reduce((o, k) => o == null ? o : o[k], S); }

    try { localStorage.setItem(CHAVE_LOCAL, JSON.stringify(S)); } catch (e) { }

    try {

/* ---------- ARRASTAR E SOLTAR ---------- */
function permitirSoltar(ev) { ev.preventDefault(); }
function arrastar(ev, origem, index) {
    if (!podeEditar()) { ev.preventDefault(); return; }
    arrastando = true;
    ev.dataTransfer.setData('origem', origem);
    ev.dataTransfer.setData('index', index);
}
function fimArrasto() { arrastando = false; if (renderPendente) pedirRender(); }
function soltar(ev) {
    ev.preventDefault();
    if (!podeEditar()) return;
    const origem = ev.dataTransfer.getData('origem');
    const index = ev.dataTransfer.getData('index');
    let destino = ev.target.id;
    if (!destino || !S.times[destino]) destino = ev.target.closest('.lista-integrantes')?.id;
    arrastando = false;
    if (origem && destino && origem !== destino && S.times[origem] && S.times[destino]) {
        const pessoa = S.times[origem].integrantes[index];
        if (pessoa == null) return;
        S.times[origem].integrantes.splice(index, 1);
        S.times[destino].integrantes.push(pessoa);
        salvar('times/' + origem, 'times/' + destino);
        renderAll();
    }
}

/* ----- Rodízio ----- */
function nomeStep(s) { const r = rodizio(s); return `${TEAMS[r.FG].nome} <b>FG</b> · ${TEAMS[r.HJT].nome} <b>HJT</b>`; }
let tmpFer = null;
function renderFer() {
    const h0 = new Date(), t0 = new Date(h0.getFullYear(), h0.getMonth(), h0.getDate()), lim = addDias(t0, 366);
    const nomeDia = d => DIAS_CURTO[d.getDay()] + ' ' + fmtData(d);
    const auto = [];
    [t0.getFullYear(), t0.getFullYear() + 1].forEach(y => {
        const m = feriadosAno(y);
        Object.keys(m).forEach(k => { const d = parseYmd(k); if (d >= t0 && d <= lim && !tmpFer.extra[k]) auto.push([k, m[k]]); });
    });
    auto.sort((a, b) => a[0] < b[0] ? -1 : 1);
    const extras = Object.keys(tmpFer.extra).filter(k => parseYmd(k) >= t0).sort();
    let h = auto.map(([k, n]) => `<label class="chk" style="display:flex;margin:3px 0"><input type="checkbox" ${tmpFer.off.has(k) ? '' : 'checked'} onchange="toggleFer('${k}', this.checked)"> <span>${nomeDia(parseYmd(k))} — ${esc(n)}</span></label>`).join('');
    h += extras.map(k => `<div class="chk" style="display:flex;justify-content:space-between;margin:3px 0"><span>${nomeDia(parseYmd(k))} — ${esc(tmpFer.extra[k])} <i style="color:#9aa7b4">(adicionado)</i></span><button class="btn-acao btn-remover" onclick="remFerExtra('${k}')" title="Remover">✕</button></div>`).join('');
    document.getElementById('mFerLista').innerHTML = h || '<p class="m-info">Nenhum feriado nos próximos 12 meses.</p>';
}
function toggleFer(k, naoTrabalha) { if (naoTrabalha) tmpFer.off.delete(k); else tmpFer.off.add(k); }
function remFerExtra(k) { delete tmpFer.extra[k]; renderFer(); }
function addFer() {
    const d = document.getElementById('mFerData').value, n = document.getElementById('mFerNome').value.trim() || 'Feriado';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { alert('Escolha a data do feriado.'); return; }
    tmpFer.extra[d] = n; tmpFer.off.delete(d);
    document.getElementById('mFerData').value = ''; document.getElementById('mFerNome').value = '';
    renderFer();
}
function abrirRodizio() {
    if (!ehAdmin()) return;
    tmpFer = { extra: Object.assign({}, S.config.feriados || {}), off: new Set(S.config.feriadosOff || []) };
    const atual = passoDe(efetivo());
    let linhas = '';
    for (let s = 0; s < 6; s++) linhas += `<tr><td>${s + 1}</td><td>${nomeStep(s)}</td></tr>`;
    let opts = '';
    for (let s = 0; s < 6; s++) opts += `<option value="${s + 1}" ${s === atual ? 'selected' : ''}>${s + 1} — ${nomeStep(s).replace(/<\/?b>/g, '')}</option>`;
    const dias = DIAS_NOME.map((n, i) => `<label class="chk"><input type="checkbox" value="${i}" ${S.config.dias.includes(i) ? 'checked' : ''}>${DIAS_CURTO[i]}</label>`).join('');
    abrirModal('Rodízio de caminhões (FG / HJT)', `
        <p class="m-info">Cada dia de carregamento avança um passo. Passos 1–3: a 1ª equipe da dupla leva o <b>FG</b> e a 2ª o <b>HJT</b>. Passos 4–6: inverte.</p>
        <table class="m-tab"><tr><th>Passo</th><th>Quem carrega</th></tr>${linhas}</table>
        <label class="m-label">Dias em que há carregamento</label>
        <div id="mDias" class="chk-linha">${dias}</div>
        <label class="m-label">Feriados (marcado = não há carregamento)</label>
        <div id="mFerLista" style="max-height:190px;overflow:auto;border:1px solid #243140;border-radius:6px;padding:4px 8px"></div>
        <div style="display:grid;grid-template-columns:140px 1fr auto;gap:6px;margin-top:8px">
            <input id="mFerData" type="date" class="m-input"><input id="mFerNome" class="m-input" placeholder="Nome (ex.: feriado municipal)"><button class="btn" onclick="addFer()">+ Adicionar</button>
        </div>
        <p class="m-info">Os nacionais já entram sozinhos (inclui Carnaval e Corpus Christi, que são pontos facultativos: desmarque se vocês trabalham). Feriados da sua cidade ou do estado, adicione acima.</p>
        <label class="m-label">O próximo dia de carregamento está no passo:</label>
        <select id="mPasso" class="m-input">${opts}</select>
        <div class="m-acoes"><button class="btn btn-ok" onclick="salvarRodizio()">Salvar</button><button class="btn" onclick="fecharModal()">Cancelar</button></div>`);
    renderFer();
}
function salvarRodizio() {
    const dias = [...document.querySelectorAll('#mDias input:checked')].map(i => +i.value);
    if (!dias.length) { alert('Marque pelo menos um dia.'); return; }
    const passo = +document.getElementById('mPasso').value;
    S.config.dias = dias;
    S.config.feriados = tmpFer.extra; S.config.feriadosOff = [...tmpFer.off];
    S.config.base = { data: ymd(efetivo()), passo };
    salvar('config'); fecharModal(); renderAll();
}

    const rotulo = { admin: 'Administrador', editor: 'Editor', viewer: 'Só visualizar' };
    let linhas = '';
    Object.keys(S.usuarios).sort().forEach(l => {
        const u = S.usuarios[l];

        linhas += `<div class="u-linha"><span class="u-nome">${esc(l)}${l === eu ? ' <i>(você)</i>' : ''}</span>
            <select class="m-input" onchange="mudarPerfil('${esc(l)}', this.value)">${sel}</select>
            <button class="btn" title="Trocar senha" onclick="trocarSenha('${esc(l)}')">🔑</button>
            <button class="btn btn-aviso" title="Excluir" onclick="excluirUsuario('${esc(l)}')">🗑</button></div>`;
    });
    abrirModal('Usuários', `
        <div class="u-lista">${linhas}</div>
        <label class="m-label">Criar novo usuário</label>
        <div class="u-novo">
            <input id="nuLogin" class="m-input" placeholder="Nome de usuário (sem espaço)" autocomplete="off" autocapitalize="none">
            <input id="nuSenha" class="m-input" type="text" placeholder="Senha" autocomplete="off">
            <select id="nuPerfil" class="m-input"><option value="editor">Editor (pode mexer nas equipes)</option><option value="viewer">Só visualizar</option><option value="admin">Administrador</option></select>
            <button class="btn btn-ok" onclick="criarUsuario()">Criar usuário</button>
        </div>
        <p class="m-info">Editor mexe nas equipes e nos caminhões. Só o administrador cria usuários e muda o rodízio.</p>`);
}
function criarUsuario() {
    const login = document.getElementById('nuLogin').value.trim().toLowerCase();
    const senha = document.getElementById('nuSenha').value;
    const role = document.getElementById('nuPerfil').value;
    if (!/^[a-z0-9_-]{2,20}$/.test(login)) { alert('Use de 2 a 20 letras minúsculas, números, - ou _ (sem espaço ou acento).'); return; }
    if (S.usuarios[login]) { alert('Esse usuário já existe.'); return; }
    if (senha.length < 4) { alert('A senha precisa ter pelo menos 4 caracteres.'); return; }
    S.usuarios[login] = { hash: hashSenha(login, senha), role };
    salvar('usuarios/' + login); abrirUsuarios();
}
function contaAdmins() { return Object.values(S.usuarios).filter(u => u.role === 'admin').length; }
function mudarPerfil(l, role) {
    if (S.usuarios[l].role === 'admin' && role !== 'admin' && contaAdmins() <= 1) { alert('Precisa existir pelo menos um administrador.'); abrirUsuarios(); return; }
    S.usuarios[l].role = role; salvar('usuarios/' + l); abrirUsuarios(); renderAll();
}
function trocarSenha(l) {
    const nova = prompt('Nova senha para "' + l + '":');
    if (nova === null) return;
    if (nova.length < 4) { alert('A senha precisa ter pelo menos 4 caracteres.'); return; }
    S.usuarios[l].hash = hashSenha(l, nova);
    if (l === usuarioAtual().login) localStorage.setItem('sessao', JSON.stringify({ u: l, h: S.usuarios[l].hash }));
    salvar('usuarios/' + l); alert('Senha alterada.'); renderAll(); abrirUsuarios();
}
function excluirUsuario(l) {
    if (l === usuarioAtual().login) { alert('Você não pode excluir o próprio usuário.'); return; }
    if (S.usuarios[l].role === 'admin' && contaAdmins() <= 1) { alert('Precisa existir pelo menos um administrador.'); return; }
    if (!confirm('Excluir o usuário "' + l + '"?')) return;
    delete S.usuarios[l]; salvar('usuarios/' + l); abrirUsuarios();
}

let travado = false;
const hojeStr = () => ymd(new Date());
const fmtBR = d => { if (!d) return '—'; const [y, m, x] = d.split('-'); return x + '/' + m + '/' + y; };
const idEquipes = () => IDS.filter(i => i !== 'reserva');
const somaUn = L => L.reduce((t, a) => t + a.qtd, 0);

function salvarAv(id, edId) {
    if (!podeEditar()) return;
    const data = document.getElementById('avData').value, qtd = Math.floor(+document.getElementById('avQtd').value);
    const produto = document.getElementById('avProd').value.trim(), obs = document.getElementById('avObs').value.trim();

    else L.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), data, produto, qtd, obs });

function removerAv(id, aid) {

    const ids = eq === 'todas' ? idEquipes() : [eq];
    const per = (de || ate) ? 'Período: ' + (de ? fmtBR(de) : 'início') + ' a ' + (ate ? fmtBR(ate) : 'hoje') : 'Período: todo o histórico';
    const dados = ids.map(i => ({ i, L: S.times[i].avarias.filter(a => (!de || a.data >= de) && (!ate || a.data <= ate)).sort((x, y) => x.data.localeCompare(y.data)) }));
    let h = `<h1>Relatório de Mercadorias Avariadas</h1><div class="sub">${per} · Emitido em ${fmtBR(hojeStr())}</div>`;
    if (ids.length > 1) {
        h += '<table><tr><th>Equipe</th><th>Registros</th><th>Unidades avariadas</th></tr>' + dados.map(d => `<tr><td>${TEAMS[d.i].nome}</td><td>${d.L.length}</td><td>${somaUn(d.L)}</td></tr>`).join('')
            + `<tr><th>TOTAL</th><th>${dados.reduce((t, d) => t + d.L.length, 0)}</th><th>${dados.reduce((t, d) => t + somaUn(d.L), 0)}</th></tr></table>`;
    }
    dados.forEach(d => {
        const t = S.times[d.i];
        h += `<div class="rp-sec" style="--c:${COR_EQ[d.i]}"><h2>Equipe ${esc(TEAMS[d.i].nome)}</h2>
            <div class="sub">Líder: ${esc(t.lider) || '—'} · Integrantes: ${esc(t.integrantes.join(', ')) || '—'}</div>`
            + (d.L.length ? `<table><tr><th>Data</th><th>Mercadoria</th><th>Qtd</th><th>Observação</th></tr>${d.L.map(a => `<tr><td>${fmtBR(a.data)}</td><td>${esc(a.produto)}</td><td>${a.qtd}</td><td>${esc(a.obs)}</td></tr>`).join('')}<tr><th colspan="2">Total</th><th colspan="2">${somaUn(d.L)} un.</th></tr></table>` : '<p>Nenhuma avaria registrada no período.</p>') + '</div>';
    });
    h += '<div class="ass"><div>Líder / Responsável</div><div>Supervisor</div></div>';
    fecharModal();
    document.getElementById('printArea').innerHTML = h;
    setTimeout(() => window.print(), 150);
}
window.addEventListener('afterprint', () => { document.getElementById('printArea').innerHTML = ''; });

/* ----- Troca obrigatória da senha padrão do admin ----- */
function abrirTrocaObrigatoria() {
    travado = true;
    abrirModal('Defina uma nova senha', `<p class="m-info">Por segurança, troque a senha padrão do administrador antes de continuar.</p>
        <input id="npS1" type="password" class="m-input" style="margin-top:10px" placeholder="Nova senha (mín. 6 caracteres)" autocomplete="new-password">
        <input id="npS2" type="password" class="m-input" style="margin-top:8px" placeholder="Repita a nova senha" autocomplete="new-password">
        <div class="m-acoes"><button class="btn btn-ok" onclick="salvarTrocaObrigatoria()">Salvar senha</button><button class="btn" onclick="fazerLogout()">Sair</button></div>`);
    document.querySelector('.modal-x').style.display = 'none';
}
function salvarTrocaObrigatoria() {
    const a = document.getElementById('npS1').value, b = document.getElementById('npS2').value;
    if (a.length < 6) { alert('A senha precisa ter pelo menos 6 caracteres.'); return; }
    if (a === 'admin123') { alert('Escolha uma senha diferente da padrão.'); return; }
    if (a !== b) { alert('As duas senhas não são iguais.'); return; }
    S.usuarios.admin.hash = hashSenha('admin', a);
    localStorage.setItem('sessao', JSON.stringify({ u: 'admin', h: S.usuarios.admin.hash }));
    travado = false; salvar('usuarios/admin'); fecharModal(); alert('Senha alterada.'); renderAll();
}

/* ---------- INÍCIO ---------- */
let diaRenderizado = '';
async function iniciar() {
    S = carregarLocal();
    if (Sync.url) {
        try {
            const raw = await Sync.ler();
            if (raw == null) { await Sync.escrever('', S); }
            else { S = norm(raw); try { localStorage.setItem(CHAVE_LOCAL, JSON.stringify(S)); } catch (e) { } }
            Sync.status('ok');
        } catch (e) { Sync.status('erro'); }
        Sync.ligar();
    } else {
        Sync.status('local');
        try { localStorage.setItem(CHAVE_LOCAL, JSON.stringify(S)); } catch (e) { }
    }
    gravarMigracao();
    renderAll();
    diaRenderizado = ymd(efetivo());
    setInterval(() => { const d = ymd(efetivo()) + ymd(new Date()); if (d !== diaRenderizado) { diaRenderizado = d; pedirRender(); } }, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { Sync.url ? Sync.atualizar() : pedirRender(); } });
}
iniciar();

    </script>
